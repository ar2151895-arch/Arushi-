name: Build & Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Details ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Version output: ${JAVA_VERSION_OUTPUT}"

          # Extract major version number (e.g., from '17.0.x' or '17')
          JAVA_MAJOR=$(echo "${JAVA_VERSION_OUTPUT}" | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "${JAVA_MAJOR}" ] || ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not detect the active Java major version."
            exit 1
          fi

          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer. Detected version: ${JAVA_MAJOR}"
            exit 1
          fi
          echo "Java environment verification passed (Java ${JAVA_MAJOR} >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          else
            echo "debug.keystore is missing. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            if [ ! -f "./debug.keystore" ]; then
              echo "Error: Failed to create ./debug.keystore."
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "Error: Expected debug APK not found at ${EXPECTED_APK}"
            echo "Searching only inside app/build/outputs/apk for generated APKs..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "Error: APK exists but is empty (0 bytes)."
            exit 1
          fi

          if [[ "${EXPECTED_APK}" != *.apk ]]; then
            echo "Error: File does not have .apk extension: ${EXPECTED_APK}"
            exit 1
          fi

          APK_SIZE=$(stat -c%s "${EXPECTED_APK}" 2>/dev/null || stat -f%z "${EXPECTED_APK}")
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          # Sanitize repository name for safe filename usage
          CLEAN_REPO_NAME=$(echo "${RAW_REPO_NAME}" | tr -cd '[:alnum:]_-')
          if [ -z "${CLEAN_REPO_NAME}" ]; then
            CLEAN_REPO_NAME="app"
          fi

          RUN_NUMBER="${GITHUB_RUN_NUMBER}"
          ASSET_FILENAME="${CLEAN_REPO_NAME}-debug-build-${RUN_NUMBER}.apk"

          RELEASE_ASSET_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "${RELEASE_ASSET_DIR}"

          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TARGET_APK="${RELEASE_ASSET_DIR}/${ASSET_FILENAME}"

          cp "${SOURCE_APK}" "${TARGET_APK}"

          if [ ! -f "${TARGET_APK}" ] || [ ! -s "${TARGET_APK}" ]; then
            echo "Error: Failed to prepare release asset at ${TARGET_APK}."
            exit 1
          fi

          echo "Prepared release asset: ${TARGET_APK}"
          echo "asset_path=${TARGET_APK}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "Error: Prepared release asset '${ASSET_PATH}' does not exist or is empty."
            exit 1
          fi

          if [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "Error: Asset file is not an .apk file."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### Debug APK Build Details

          - **Build Type:** Automatically generated debug APK
          - **Builder:** GitHub Actions
          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Commit SHA:** ${GITHUB_SHA}
          - **Testing Note:** This APK is intended for testing and development.
          - **Release Status:** Not a Play Store production release.
          - **Signing:** Signed only with a temporary debug keystore.
          EOF
          )

          echo "Publishing release: ${RELEASE_TAG}..."
          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes "${NOTES}" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            gh release view "${RELEASE_TAG}"

            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --json url --jq .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "Asset Filename: ${ASSET_NAME}"

            echo "### 🚀 Debug APK Build & Release Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **Debug APK successfully built and published to GitHub Releases!**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [${RELEASE_TITLE}](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Download APK:** The file \`${ASSET_NAME}\` is available directly under the release **Assets** section." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup Artifact:** The normal Actions artifact \`app-debug-apk\` is also available for this run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "The debug APK build completed successfully, and the GitHub Actions artifact remains available."

            echo "### ⚠️ Debug APK Build Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **Debug APK was built successfully!**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ *GitHub Release creation encountered an issue or was skipped, but the APK artifact is preserved.*" >> "$GITHUB_STEP_SUMMARY"
            echo "- You can download the verified debug APK from the workflow run **Artifacts** section as **\`app-debug-apk\`**." >> "$GITHUB_STEP_SUMMARY"
          fi
